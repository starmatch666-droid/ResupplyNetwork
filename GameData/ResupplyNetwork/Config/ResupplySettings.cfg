// ============================================================================
//  ResupplyNetwork - 补给系数配置
//  KSP 1.12.5  |  生涯模式
//  金额单位：资金(funds)   质量单位：吨(t)   时间单位：秒(UT, 1 Kerbin 日=21600)
//
//  单价   = unitCost * scarcityMultiplier （或 UNIT_PRICE_OVERRIDE），不低于 minUnitPrice
//  运费   = 质量 * K_mass * (1 + dv_park/dv_ref) * (1 + K_time * 转移年数) * K_premium
//  服务费 = ceil(质量 / B_trip) * S_trip
//  总价   = max(物资费 + 运费 + 服务费, S_min)
//  交付时间 = T_base + ceil(质量 / B_trip) * transferTime
// ============================================================================

RESUPPLY_CONFIG
{
	// ---------------- 全局系数 ----------------
	// 提示：游戏内的「难度设置 → 补给网 Resupply Network」里有同名参数，
	// 那个页面上的值优先级高于这里。这里填的是新存档的默认值
	// （同时也是离线定价工具 tools/PriceReport 读取的来源）。
	// 列表类配置（稀缺溢价 / 排除表 / 目的地覆盖）只在文件里，页面上没有。
	K_mass = 4000
	dv_ref = 1000
	K_time = 0.5
	K_premium = 1.0
	B_trip = 20
	S_trip = 800
	S_min = 1000
	T_base = 7200
	// 取消待交付订单时的退款比例
	cancelRefund = 0.8
	// ---------------- 定时补给默认值 ----------------
	// 模拟现实里按固定班期往空间站打的补给飞船：
	// 每 autoIntervalDays 天检查一次，余量低于 autoThreshold 时补到 autoTarget
	autoThreshold = 0.3
	autoTarget = 1.0
	autoIntervalDays = 30
	// 单笔预算上限，<=0 表示不限
	autoMaxFunds = 50000
	// ---------------- 加急 ----------------
	// 加急订单：费用乘这个倍率，交付时间乘那个比例
	rushCostMultiplier = 2.5
	rushTimeFactor = 0.4
	// ---------------- 前置条件与损失 ----------------
	// true = 没有可用通信链路的航天器不能补给（对接口要求已在设计上取消）
	requireCommLink = true
	// 目标航天器不存在导致订单作废时的退款比例
	vesselLostRefund = 0.5
	// ---------------- 殖民地补给 ----------------
	// 目标天体上若有功能完善的殖民地，补给改由它作为本地货源发货：
	// 判定 = 停在表面 + 乘员不少于 colonyMinCrew + 至少有一个转换器/采掘器/后勤模块
	colonyEnabled = true
	colonyMinCrew = 3
	// 乘在“本地发射”估算上的额外系数
	colonyFreightFactor = 1.0
	// 仅用于“真正零质量”的资源（电、热之类）的名义搬运质量；
	// 轻但非零的资源按真实密度算，不受这个值影响。
	minDensity = 0.000001
	minUnitPrice = 0.01
	autoComputeZones = true

	// ---------------- 单位价覆盖 ----------------
	// 原版这些资源要么免费要么无质量，必须人工定价
	UNIT_PRICE_OVERRIDE
	{
		name = ElectricCharge
		price = 0.05
	}
	UNIT_PRICE_OVERRIDE
	{
		name = StoredCharge
		price = 0.05
	}

	// ---------------- 稀缺溢价 ----------------
	// CRP 作者原本把反物质类内部一致地定在 100000 资金/克：
	//   Antimatter    100 资金/单位 ÷ 0.001 克/单位 = 100000 资金/克
	//   AntiHydrogen  8600000 资金/单位 ÷ 86 克/单位 = 100000 资金/克
	// 下面把这一档整体抬到 2000000 资金/克（x20）
	SCARCITY
	{
		name = Antimatter
		multiplier = 20
	}
	SCARCITY
	{
		name = AntiHydrogen
		multiplier = 20
	}
	SCARCITY
	{
		name = Plutonium-238
		multiplier = 3
	}
	SCARCITY
	{
		name = EnrichedUranium
		multiplier = 3
	}
	SCARCITY
	{
		name = UraniumNitride
		multiplier = 3
	}
	SCARCITY
	{
		name = UF4
		multiplier = 3
	}
	SCARCITY
	{
		name = ThF4
		multiplier = 3
	}
	SCARCITY
	{
		name = Thorium
		multiplier = 3
	}
	SCARCITY
	{
		name = FusionPellets
		multiplier = 2
	}
	SCARCITY
	{
		name = LqdHe3
		multiplier = 2
	}
	SCARCITY
	{
		name = Lithium6
		multiplier = 2
	}
	SCARCITY
	{
		name = LqdTritium
		multiplier = 2
	}

	// ---------------- 排除表 ----------------
	// 要么本存档无消耗方，要么代表“空间/环境”而非物质
	EXCLUDE
	{
		name = Megajoules
	}
	EXCLUDE
	{
		name = ChargedParticles
	}
	EXCLUDE
	{
		name = VacuumPlasma
	}
	EXCLUDE
	{
		name = ExoticMatter
	}
	EXCLUDE
	{
		name = WasteHeat
	}
	EXCLUDE
	{
		name = ThermalPower
	}
	EXCLUDE
	{
		name = KDVolume
	}
	EXCLUDE
	{
		name = IntakeAir
	}
	EXCLUDE
	{
		name = IntakeAtm
	}
	EXCLUDE
	{
		name = IntakeLqd
	}
	EXCLUDE
	{
		name = FanIntakeAir
	}
	EXCLUDE
	{
		name = SolarWind
	}

	// ---------------- Kerbin 系目的地覆盖 ----------------
	// 这里【不要】写死 rate：不写就按基础运费系数（K_mass / dv_ref / K_time / K_premium）
	// 实时计算，所以拖难度设置页的滑块会立刻反映到这几个最常用的目的地上。
	// 只有需要刻意偏离公式的特例，才用 rateMultiplier（乘在公式结果上）或 rate（直接写死）。
	// 不在表内的天体由 autoComputeZones 按轨道数据自动估算。
	ZONE_OVERRIDE
	{
		body = Kerbin
		situation = Splashed
		dv = 0
		transferTime = 7200
		rateMultiplier = 0.25
	}
	ZONE_OVERRIDE
	{
		body = Kerbin
		situation = Flying
		dv = 0
		transferTime = 7200
		rateMultiplier = 0.25
	}
	ZONE_OVERRIDE
	{
		body = Kerbin
		situation = Landed
		dv = 0
		transferTime = 7200
		rateMultiplier = 0.25
	}
	ZONE_OVERRIDE
	{
		body = Kerbin
		situation = Orbiting
		dv = 0
		transferTime = 21600
	}
	ZONE_OVERRIDE
	{
		body = Kerbin
		situation = Docked
		dv = 0
		transferTime = 21600
	}
	ZONE_OVERRIDE
	{
		body = Mun
		situation = Orbiting
		dv = 1170
		transferTime = 32400
	}
	ZONE_OVERRIDE
	{
		body = Mun
		situation = Landed
		dv = 1750
		transferTime = 36720
	}
	ZONE_OVERRIDE
	{
		body = Minmus
		situation = Orbiting
		dv = 1090
		transferTime = 43200
	}
	ZONE_OVERRIDE
	{
		body = Minmus
		situation = Landed
		dv = 1270
		transferTime = 47520
	}

	// ---------------- 跨恒星系 / 虫洞手工定价 ----------------
	// 不能按直线距离算，必须手工给
	ROUTE_OVERRIDE
	{
		from = Sun
		to = Simeht
		rate = 370000
		transferTime = 138049920
	}
}
