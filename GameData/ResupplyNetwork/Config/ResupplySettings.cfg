		dv = 0
		transferTime = 7200
		rate = 1000
	}
	ZONE_OVERRIDE
	{
		body = Kerbin
		situation = Orbiting
		dv = 0
		transferTime = 21600
		rate = 4000
	}
	ZONE_OVERRIDE
	{
		body = Kerbin
		situation = Docked
		dv = 0
		transferTime = 21600
		rate = 4000
	}
	ZONE_OVERRIDE
	{
		body = Mun
		situation = Orbiting
		dv = 1170
		transferTime = 32400
		rate = 8700
	}
	ZONE_OVERRIDE
	{
		body = Mun
		situation = Landed
		dv = 1750
		transferTime = 36720
		rate = 11000
	}
	ZONE_OVERRIDE
	{
		body = Minmus
		situation = Orbiting
		dv = 1090
		transferTime = 43200
		rate = 8400
	}
	ZONE_OVERRIDE
	{
		body = Minmus
		situation = Landed
		dv = 1270
		transferTime = 47520
		rate = 9100
	}

	// ---------------- 跨恒星系 / 虫洞手工定价 ----------------
	// 不能按直线距离算，必须手工给
	ROUTE_OVERRIDE
	{
		from = Sun
		to = Simeht
		rate = 370000
		transferTime = 138049920
	}
}
